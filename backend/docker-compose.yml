services:
  postgres:
    image: postgres
    container_name: postgres-dance-school
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres-dance-school-data:/var/lib/postgresql

volumes:
  postgres-dance-school-data:
